<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hunter Market - Solo Leveling</title>
  <meta name="description" content="Browse 10,000 hunters with ranks, stats and recruit prices in INR.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap wide">
    <header class="brand">
      <p class="eyebrow">[ SYSTEM ]</p>
      <h1>Hunter Market</h1>
      <p class="sub">10,000 hunters. Prices are one-time recruit fees in INR.</p>
      <p><a href="index.html">Back to login</a></p>
    </header>

    <section class="panel wide-panel">
      <div id="summary" class="summary"></div>

      <div class="filters">
        <div>
          <label for="f-search">Search name or ID</label>
          <input id="f-search" type="search" placeholder="e.g. Kim or H00042">
        </div>
        <div>
          <label for="f-rank">Rank</label>
          <select id="f-rank"></select>
        </div>
        <div>
          <label for="f-class">Class</label>
          <select id="f-class"></select>
        </div>
        <div>
          <label for="f-sort">Sort by</label>
          <select id="f-sort">
            <option value="id">ID</option>
            <option value="power-desc">Power (high to low)</option>
            <option value="power-asc">Power (low to high)</option>
            <option value="price-desc">Price (high to low)</option>
            <option value="price-asc">Price (low to high)</option>
          </select>
        </div>
      </div>

      <p id="status" class="hint" role="status">Loading hunters...</p>

      <div class="table-scroll">
        <table id="table">
          <thead>
            <tr>
              <th>ID</th><th>Name</th><th>Rank</th><th>Class</th>
              <th>STR</th><th>AGI</th><th>INT</th><th>VIT</th><th>SENSE</th>
              <th>Power</th><th>Price (INR)</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

      <div class="actions pager">
        <button type="button" id="prev" class="ghost">Previous</button>
        <span id="page-info" class="hint"></span>
        <button type="button" id="next" class="ghost">Next</button>
      </div>
    </section>

    <footer class="foot">Also available as <a href="players.csv">players.csv</a> and <a href="players.json">players.json</a>.</footer>
  </main>
  <script src="hunters.js"></script>
</body>
</html>
