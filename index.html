<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solo Leveling: Hunter Management</title>
  <meta name="description" content="Hunter login for the Solo Leveling management game.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header class="brand">
      <p class="eyebrow">[ SYSTEM ]</p>
      <h1>Hunter Management</h1>
      <p class="sub">Select your hunter profile to enter the Gate.</p>
    </header>

    <!-- Screen 1: pick a hunter -->
    <section id="screen-select" class="screen">
      <div id="roster" class="roster" role="list"></div>
    </section>

    <!-- Screen 2: password -->
    <section id="screen-login" class="screen hidden">
      <form id="login-form" class="panel" autocomplete="off" novalidate>
        <p class="eyebrow" id="login-eyebrow">[ LOGIN ]</p>
        <h2 id="login-title"></h2>
        <p id="login-hint" class="hint"></p>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" minlength="6" autocomplete="current-password" required>

        <div id="confirm-row" class="hidden">
          <label for="confirm">Confirm password</label>
          <input id="confirm" name="confirm" type="password" minlength="6" autocomplete="new-password">
        </div>

        <p id="login-error" class="error" role="alert"></p>

        <div class="actions">
          <button type="button" id="back" class="ghost">Back</button>
          <button type="submit" id="submit">Enter</button>
        </div>
      </form>
    </section>

    <!-- Screen 3: the game -->
    <section id="screen-game" class="screen hidden">
      <div id="game"></div>
    </section>

    <footer class="foot">
      Profiles, passwords and game progress are stored only in this browser. This is a game login, not real security.
      <br><a href="hunters.html">Browse the Hunter Market (10,000 hunters)</a>
    </footer>
  </main>
  <script src="engine.js"></script>
  <script src="game-ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
